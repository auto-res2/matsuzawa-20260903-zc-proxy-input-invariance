name: "Publish Paper"
run-name: "📄 Build the paper and publish the artifact of record"

# Runs on the protected branch only. Every sha there has already passed
# "Verify the record" -- branch protection requires it -- and that check
# covers the paper's numbers as well as the record, so what is left to do
# here is compile and publish. That ordering ("verify green, then publish")
# comes from the protection rule, not from coupling this workflow to the
# other one; a workflow_run trigger would add three GitHub-specific traps
# to guarantee something the branch already guarantees.
#
# Publishing means two things: the PDF and its report are uploaded as the
# run's artifact, and the same PDF bytes are committed back onto the
# protected branch as `.research/latex/<template>/paper.pdf`, so the paper
# of record outlives the artifact's retention and sits next to the sources
# it was built from. That commit goes through the gate like any other: it
# is pushed to a scratch ref, "Verify the record" is dispatched on it, and
# only a green check lets it fast-forward onto the branch. Pushes made with
# the workflow's own token start no workflows, so the commit cannot
# re-trigger this one (the gate is started explicitly for that reason) and
# no recursion guard is needed.
#
# Not a required check, so it may filter to the paths it actually reads.
on:
  push:
    branches: [main]
    paths:
      - ".research/latex/**"
      - ".research/record.json"
      - ".research/results/**"
  workflow_dispatch:

permissions:
  contents: write   # push the PDF commit
  actions: write    # dispatch "Verify the record" on the scratch ref
  checks: read      # read that check's conclusion

defaults:
  run:
    shell: bash

jobs:
  # `airas verify-paper` re-runs every check before compiling and deletes
  # the PDF if any fails. On a protected branch that is redundant with the
  # gate, and cheap; it is kept as the safety net for a repository whose
  # protection was never configured, so an unverified paper is still not
  # published as though it were.
  publish-paper:
    name: Build and publish the paper
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the provenance check requires the declared run's
          # commit to be an ancestor of HEAD, which a shallow clone cannot
          # answer.
          fetch-depth: 0

      - name: Look for a paper
        id: paper
        run: |
          if compgen -G ".research/latex/*/main.tex" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No .research/latex/*/main.tex — nothing to build yet."
          fi

      - name: Install LaTeX toolchain
        if: steps.paper.outputs.present == 'true'
        uses: Wandalen/wretry.action@v3
        with:
          attempt_limit: 3
          attempt_delay: 30000
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              texlive-base \
              texlive-latex-recommended \
              texlive-fonts-recommended \
              texlive-latex-extra \
              texlive-science \
              texlive-luatex \
              texlive-lang-japanese

      - name: Install uv
        if: steps.paper.outputs.present == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Verify paper values and provenance, build PDF
        if: steps.paper.outputs.present == 'true'
        env:
          SEYVAL_API_KEY: ${{ secrets.SEYVAL_API_KEY }}
        run: |
          uvx --from "airas @ git+https://github.com/airas-org/airas.git@main#subdirectory=backend" \
            airas verify-paper --local-path . --output-dir paper-artifact

      # Always uploaded, but the gate deletes the PDF when verification
      # fails, so a red run publishes the report alone — the PDF exists only
      # for a paper that passed.
      - name: Upload verification report and PDF
        if: always() && steps.paper.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-paper-${{ github.sha }}
          path: paper-artifact/
          if-no-files-found: ignore

      # The PDF the artifact holds, committed byte-for-byte next to its
      # sources. The commit is made here, not by the agent: a PDF built on
      # the agent's machine proves nothing, this one was built where the
      # agent cannot intervene, from a sha the gate had already passed.
      - name: Commit the CI-built PDF onto the protected branch
        if: success() && steps.paper.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pdf=$(ls paper-artifact/*.pdf 2>/dev/null | head -1 || true)
          if [ -z "$pdf" ]; then
            echo "No PDF to commit (verification removed it)."
            exit 0
          fi
          template=$(basename "$(dirname "$(ls .research/latex/*/main.tex | head -1)")")
          dest=".research/latex/$template/paper.pdf"
          if [ -f "$dest" ] && cmp -s "$pdf" "$dest"; then
            echo "$dest already holds this build."
            exit 0
          fi
          cp "$pdf" "$dest"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -q \
            -m "paper: CI-built PDF for ${GITHUB_SHA}" \
            -m "Built by Publish Paper run ${GITHUB_RUN_ID} from ${GITHUB_SHA}; byte-identical to the artifact verified-paper-${GITHUB_SHA}."
          sha=$(git rev-parse HEAD)
          scratch="verify-paper-${GITHUB_SHA::12}"
          echo "PDF commit $sha, staged on $scratch"

          # The scratch ref stands in for the agent's `verify`: pushing the
          # commit there lets the required check run on this exact sha.
          git push -q --force origin "HEAD:refs/heads/$scratch"
          gh workflow run verify_record.yml --ref "$scratch"

          state=pending
          for _ in $(seq 1 60); do
            sleep 20
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Verify the record")]
                    | if length == 0 then "pending"
                      else (.[0] | if .status == "completed" then .conclusion else .status end) end')
            echo "Verify the record on $sha: $state"
            case "$state" in
              success) break ;;
              failure|cancelled|timed_out|action_required|stale)
                echo "The gate rejected the PDF commit; nothing lands." >&2
                exit 1 ;;
            esac
          done
          if [ "$state" != success ]; then
            echo "The gate did not finish in time; nothing lands." >&2
            exit 1
          fi

          # Fast-forward only. If the branch moved meanwhile the push fails
          # and the next Publish Paper run, on the new head, commits the PDF
          # for that head instead.
          git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          git push -q origin --delete "$scratch" || true
          echo "paper.pdf for ${GITHUB_SHA} landed as $sha on ${GITHUB_REF_NAME}."
